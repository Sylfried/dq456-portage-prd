<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DQ debug</title>
<style>
body { font: 13px/1.45 system-ui, sans-serif; margin: 0; background: #16181d; color: #dfe3ea; }
header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #20232b; position: sticky; top: 0; flex-wrap: wrap; }
header b { font-size: 15px; }
button, input, select { font: inherit; background: #2c313c; color: #dfe3ea; border: 1px solid #444b59; border-radius: 4px; padding: 3px 8px; }
button:hover { background: #3a4150; cursor: pointer; }
button.on { background: #3d6b45; }
nav { display: flex; gap: 2px; padding: 0 12px; background: #20232b; border-bottom: 1px solid #333; }
nav a { padding: 6px 12px; cursor: pointer; color: #9aa3b2; }
nav a.sel { color: #fff; border-bottom: 2px solid #7fb07f; }
main { padding: 12px; }
section { display: none; } section.sel { display: block; }
table { border-collapse: collapse; } td, th { padding: 2px 8px; border-bottom: 1px solid #2b2f38; text-align: left; vertical-align: top; }
th { color: #9aa3b2; font-weight: normal; }
pre, .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 12px; }
pre { background: #101216; padding: 8px; overflow: auto; max-height: 60vh; }
.dim { color: #8a93a3; } .warn { color: #ffcf6e; } .err { color: #ff8a8a; }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.active { background: #26402b; }
.tech { font-style: italic; color: #8a93a3; } .allmax { margin-left: 8px; }
.num { display: inline-flex; gap: 2px; align-items: center; } .num .mm { padding: 3px 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <b id="title">DQ debug</b>
  <span id="status" class="mono"></span>
  <button id="b_pause"></button>
  <button id="b_step1">+1</button><button id="b_step10">+10</button><button id="b_step60">+60</button>
  <select id="speed"></select>
  <button id="b_report"></button>
  <span id="msg" class="warn"></span>
</header>
<nav id="tabs"></nav>
<main>
  <section id="t_state"><div class="grid" id="state"></div><h4 id="h_log"></h4><pre id="log"></pre></section>
  <section id="t_places">
    <h4 id="h_map"></h4><div class="row"><select id="sc_map"></select><button id="sc_go"></button><span class="dim" id="sc_cur"></span></div><p class="dim" id="sc_map_note"></p>
    <h4 id="h_world"></h4><div class="row"><select id="sc_world_at"></select><button id="sc_world"></button></div>
  </section>
  <section id="t_story">
    <h4 id="h_step"></h4><div class="row"><select id="sc_step"></select><label><input type="checkbox" id="sc_step_go" checked> <span id="l_step_go"></span></label><button id="sc_apply"></button></div><p class="dim" id="sc_step_note"></p>
    <h4 id="h_sw"></h4><p class="dim" id="sc_sw_note"></p><div class="row"><select id="sc_set"></select><span id="sc_n_box"></span><button id="sc_on"></button><button id="sc_off"></button></div><div id="sc_flags" class="mono"></div>
  </section>
  <section id="t_fights">
    <div class="row"><select id="sc_group"></select><select id="sc_backdrop"></select><button id="sc_fight"></button></div>
    <p class="dim" id="sc_fight_note"></p><div class="row"><button id="sc_backdrop_go"></button><span class="dim" id="sc_backdrop_cur"></span></div>
  </section>
  <section id="t_party">
    <h4 id="h_hero"></h4><div class="row"><input id="pa_hero" size="14" maxlength="8"><button id="pa_hero_go"></button><span class="dim" id="pa_hero_note"></span></div>
    <h4><span id="h_members"></span><button class="allmax" data-allmax="levels"></button></h4><div id="pa_members"></div>
    <div class="row"><select id="pa_char"></select><button id="pa_join"></button></div>
    <h4 id="h_jobs_box"><span id="h_jobs"></span><button class="allmax" data-allmax="jobs"></button></h4><div id="pa_jobs"></div>
    <h4><span id="h_values"></span><button class="allmax" data-allmax="stats"></button></h4><div id="pa_values" class="grid"></div>
  </section>
  <section id="t_items">
    <h4 id="h_give"></h4><div class="row"><input id="sc_item_find" size="16"><select id="sc_item"></select><span id="sc_count_box"></span><button id="sc_give"></button></div><p class="dim" id="sc_items_note"></p>
    <div class="row"><button id="pa_items"></button><span class="dim" id="pa_items_note"></span></div>
    <h4><span id="h_money"></span><button class="allmax" data-allmax="money"></button></h4><div id="it_money" class="grid"></div>
  </section>
  <section id="t_activities">
    <h4 id="h_mini"></h4><div class="row" id="sc_minigames"></div>
    <h4 id="h_extras_box"><span id="h_extras"></span><button class="allmax" data-allmax="extras"></button></h4><div id="pa_extras"></div>
  </section>
  <section id="t_book">
    <div class="row"><button id="bk_all"></button><button id="bk_none"></button><input id="bk_find" size="18"><span class="dim" id="bk_count"></span></div>
    <p class="dim" id="bk_note"></p><div id="bk_pages"></div>
  </section>
  <section id="t_texts">
    <div class="row"><select id="tx_file"></select><input id="tx_find" size="18"><span class="dim" id="tx_count"></span></div>
    <select id="tx_list" size="16" style="width:100%"></select>
    <div class="row"><input id="tx_num" size="22"><label><span id="l_tx_n"></span> <span id="tx_n_box"></span></label>
      <button id="tx_prev">◀</button><button id="tx_show"></button><button id="tx_next">▶</button></div>
    <p class="dim" id="tx_note"></p>
    <h4 id="h_tx_custom"></h4><textarea id="tx_custom" rows="3" cols="64" maxlength="400"></textarea>
    <div class="row"><button id="tx_custom_show"></button><span class="dim" id="tx_custom_count"></span></div>
  </section>
  <section id="t_packets"><div class="row"><label><input type="checkbox" id="pk_follow" checked> <span id="l_follow"></span></label>
    <input id="pk_filter" placeholder="types: 22 28 / !22 !28 !29" size="28"><span class="dim" id="pk_count"></span></div><pre id="packets"></pre></section>
  <section id="t_menus"><div id="menus"></div></section>
  <section id="t_objects"><div id="objects"></div></section>
  <section id="t_memory"><div class="row"><input id="mem_where" placeholder="symbol, 0x... or +0x..." size="48"> <span id="mem_len_box"></span>
    <button id="mem_read"></button><span class="dim" id="mem_info"></span></div>
    <div class="row"><input id="mem_bytes" placeholder="00 01 02 ..." size="48"><button id="mem_write"></button></div><pre id="memory"></pre></section>
  <section id="t_states"><div id="states"></div></section>
</main>

const LIMITS = {item_count: [1, 99], switch: [0, 1023]};
const it = s => String(s).replace(/[a-z]/g, c => String.fromCodePoint(0x1D622 + c.charCodeAt(0) - 97)).replace(/[A-Z]/g, c => String.fromCodePoint(0x1D608 + c.charCodeAt(0) - 65));          // a technical name in a list: italic letters (an option cannot style a part of its text)

function mm(id, v, apply, label) { return `<button class="mm" data-for="${id}" data-v="${v}"${apply ? ` data-apply="${apply}"` : ''}>${label}</button>`; }
function num(id, v, lim, apply) {          // a number field kept within [least, most] (and their length), with Min and Max (that apply at once where the field has its own button)
  const [lo, hi] = lim || [0, 999999999], w = Math.max(width(lo), width(hi));

}
function timeField(id, v, lim, apply) {          // play time h:mm:ss (1/60 s in the game), within [least, most]

}
document.addEventListener('input', e => {
  const t = e.target; if (!t.classList) return;

  if (!t.classList.contains('nf')) return;
  const lo = +t.dataset.lo, hi = +t.dataset.hi; let s = t.value.replace(lo < 0 ? /[^0-9-]/g : /[^0-9]/g, '').replace(/(?!^)-/g, '');
  if (s !== '' && s !== '-') { if (+s > hi) s = String(hi); if (lo < 0 && +s < lo) s = String(lo); }

  $('tx_list').innerHTML = rows.map(([k, n, t]) => `<option value="${k}">#${k} · ${n} — ${esc(t)}</option>`).join('');
}
function textKey() { const k = $('tx_list').value; return k === '' ? null : `${txFile.file}#${k}`; }
function stepText(d) {
  const o = $('tx_list'); if (!o.options.length) return; o.selectedIndex = Math.max(0, Math.min(o.options.length - 1, o.selectedIndex + d)); $('tx_num').value = textKey(); showText();
}
function showText() { const v = $('tx_num').value.trim() || textKey(); if (v) cmd({cmd: 'show_text', number: v, count: +$('tx_n').value || 1}); }
$('tx_file').onchange = () => loadTextFile($('tx_file').value);
$('tx_find').oninput = renderTexts;
$('tx_list').onchange = () => { $('tx_num').value = textKey(); };
$('tx_list').ondblclick = () => { $('tx_num').value = textKey(); showText(); };
$('tx_show').onclick = showText;
$('tx_custom').oninput = () => { $('tx_custom_count').textContent = $('tx_custom').value.length + ' / 400'; };
$('tx_custom_show').onclick = () => cmd({cmd: 'show_custom', text: $('tx_custom').value});
$('tx_prev').onclick = () => stepText(-1);
$('tx_next').onclick = () => stepText(1);
async function refreshItems() { if (!catalog) await loadCatalog(); return refreshParty(); }
async function refreshActivities() { if (!catalog) await loadCatalog(); return refreshExtras(); }
async function ensureCatalog() { if (!catalog) return loadCatalog(); }
const PAGES = {t_texts: refreshTexts, t_book: refreshBook, t_party: refreshParty, t_items: refreshItems, t_activities: refreshActivities, t_places: ensureCatalog, t_story: refreshScenes,
  t_fights: ensureCatalog, t_packets: refreshPackets, t_menus: refreshMenus, t_objects: refreshObjects, t_states: refreshStates};
async function refresh() {
  try { const v = await get('/api/state'); if (v.error) throw new Error(v.error); last = v; renderState(v); $('msg').textContent = ''; } catch (e) { $('msg').textContent = String(e); }
  if (PAGES[tab] && (tab !== 't_states' || !refresh.statesShown)) { try { await PAGES[tab](); } catch (e) { $('msg').textContent = String(e); } }
  refresh.statesShown = tab === 't_states';
}
$('b_pause').onclick = () => cmd({cmd: last && last.paused ? 'resume' : 'pause'}).then(refresh);
$('b_step1').onclick = () => cmd({cmd: 'step', n: 1}).then(refresh);
$('b_step10').onclick = () => cmd({cmd: 'step', n: 10}).then(refresh);
$('b_step60').onclick = () => cmd({cmd: 'step', n: 60}).then(refresh);
$('speed').onchange = () => cmd({cmd: 'speed', value: +$('speed').value});
$('b_report').onclick = () => cmd({cmd: 'report'});
$('mem_read').onclick = readMemory;
$('mem_write').onclick = () => { if (confirm(L.confirm_write)) cmd({cmd: 'write_memory', where: $('mem_where').value, bytes: $('mem_bytes').value}).then(readMemory); };
texts(); show(); refresh(); setInterval(refresh, 500);
</script>
