<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DQ debug</title>
<style>
body { font: 13px/1.45 system-ui, sans-serif; margin: 0; background: #16181d; color: #dfe3ea; }
header { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #20232b; position: sticky; top: 0; flex-wrap: wrap; }
header b { font-size: 15px; }
button, input, select { font: inherit; background: #2c313c; color: #dfe3ea; border: 1px solid #444b59; border-radius: 4px; padding: 3px 8px; }
button:hover { background: #3a4150; cursor: pointer; }
button.on { background: #3d6b45; }
nav { display: flex; gap: 2px; padding: 0 12px; background: #20232b; border-bottom: 1px solid #333; }
nav a { padding: 6px 12px; cursor: pointer; color: #9aa3b2; }
nav a.sel { color: #fff; border-bottom: 2px solid #7fb07f; }
main { padding: 12px; }
section { display: none; } section.sel { display: block; }
table { border-collapse: collapse; } td, th { padding: 2px 8px; border-bottom: 1px solid #2b2f38; text-align: left; vertical-align: top; }
th { color: #9aa3b2; font-weight: normal; }
pre, .mono { font-family: Consolas, 'DejaVu Sans Mono', monospace; font-size: 12px; }
pre { background: #101216; padding: 8px; overflow: auto; max-height: 60vh; }
.dim { color: #8a93a3; } .warn { color: #ffcf6e; } .err { color: #ff8a8a; }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.active { background: #26402b; }
</style>
</head>
<body>
<header>
  <b id="title">DQ debug</b>
  <span id="status" class="mono"></span>
  <button id="b_pause"></button>
  <button id="b_step1">+1</button><button id="b_step10">+10</button><button id="b_step60">+60</button>
  <select id="speed"></select>
  <button id="b_report"></button>
  <span id="msg" class="warn"></span>
</header>
<nav id="tabs"></nav>
<main>
  <section id="t_state"><div class="grid" id="state"></div><h4 id="h_log"></h4><pre id="log"></pre></section>
  <section id="t_scenes">
    <h4 id="h_map"></h4><div class="row"><select id="sc_map"></select><button id="sc_go"></button><span class="dim" id="sc_cur"></span></div>
    <div class="row"><select id="sc_world_at"></select><button id="sc_world"></button></div>
    <h4 id="h_step"></h4><div class="row"><select id="sc_step"></select><label><input type="checkbox" id="sc_step_go" checked> <span id="l_step_go"></span></label><button id="sc_apply"></button></div><p class="dim" id="sc_step_note"></p>
    <h4 id="h_fight"></h4><div class="row"><select id="sc_boss"></select><input id="sc_row" size="6"><button id="sc_fight"></button><span class="dim" id="sc_fight_note"></span></div>
    <div class="row"><select id="sc_group"></select><button id="sc_here"></button></div>
    <div class="row"><select id="sc_backdrop"></select><button id="sc_backdrop_go"></button></div>
    <h4 id="h_mini"></h4><div class="row" id="sc_minigames"></div>
    <h4 id="h_items"></h4><div class="row"><input id="sc_item_find" size="16"><select id="sc_item"></select><input id="sc_count" value="1" size="3"><button id="sc_give"></button></div>
    <div class="row"><input id="sc_gold" value="1000" size="9"><button id="sc_gold_go"></button><span class="dim" id="sc_items_note"></span></div>
    <h4 id="h_sw"></h4><p class="dim" id="sc_sw_note"></p><div class="row"><select id="sc_set"></select><input id="sc_n" size="6"><button id="sc_on"></button><button id="sc_off"></button></div><div id="sc_flags" class="mono"></div>
  </section>
  <section id="t_party">
    <h4 id="h_members"></h4><div id="pa_members"></div>
    <div class="row"><select id="pa_char"></select><button id="pa_join"></button></div>
    <h4 id="h_values"></h4><div id="pa_values" class="grid"></div>
    <h4 id="h_allitems"></h4><div class="row"><button id="pa_items"></button><span class="dim" id="pa_items_note"></span></div>
  </section>
  <section id="t_book">
    <div class="row"><button id="bk_all"></button><button id="bk_none"></button><input id="bk_find" size="18"><span class="dim" id="bk_count"></span></div>
    <p class="dim" id="bk_note"></p><div id="bk_pages"></div>
  </section>
  <section id="t_packets"><div class="row"><label><input type="checkbox" id="pk_follow" checked> <span id="l_follow"></span></label>
    <input id="pk_filter" placeholder="types: 22 28 / !22 !28 !29" size="28"><span class="dim" id="pk_count"></span></div><pre id="packets"></pre></section>
  <section id="t_menus"><div id="menus"></div></section>
  <section id="t_objects"><div id="objects"></div></section>
  <section id="t_memory"><div class="row"><input id="mem_where" placeholder="symbol, 0x... or +0x..." size="48"> <input id="mem_len" value="256" size="5">
    <button id="mem_read"></button><span class="dim" id="mem_info"></span></div>
    <div class="row"><input id="mem_bytes" placeholder="00 01 02 ..." size="48"><button id="mem_write"></button></div><pre id="memory"></pre></section>
  <section id="t_states"><div id="states"></div></section>
</main>
<script>
const T = {
  fr: {state: 'État', packets: 'Paquets', menus: 'Menus', objects: 'Objets', memory: 'Mémoire', states: 'Sauvegardes d\'état',

       fade: 'fondu avant', bfade: 'fondu arrière', menu: 'menu actif', message: 'message', pace: 'rythme', sprites: 'Personnages', meshes: 'Maillages', camera: 'caméra',
       port: 'port', type: 'type', cursor: 'curseur', buttons: 'boutons', lines: 'lignes', yes: 'oui', no: 'non', confirm_write: 'Écrire dans la mémoire du moteur ?', loadq: 'Charger cette sauvegarde d\'état ?',
       scenes: 'Scènes', maph: 'Carte', go: 'Y aller', world: 'Carte du monde', world_here: 'devant le lieu actuel', world_n: 'Monde', current: 'carte actuelle', step: 'Étape de l\'histoire', apply: 'Appliquer', step_go: 'aller sur sa carte',
       step_note: 'Remet les interrupteurs globaux et l\'équipe de cette étape ; objets, niveaux et or ne changent pas. Le héros arrive par l\'entrée principale de la carte.',
       fight: 'Combat', start_fight: 'Lancer le combat', row: 'ligne (vide : celle de l\'endroit)', bosses: 'boss', switches: 'Interrupteurs', on: 'Allumer', off: 'Éteindre',
       items: 'Objets et or', give: 'Donner', find: 'chercher…', gold_add: 'Or (négatif : retirer)', items_note: 'Donnés comme un objet trouvé : au premier membre qui a de la place, sinon au sac.',
       group: 'groupe', fight_here: 'Combattre ce groupe ici', backdrop_own: 'décor de chaque combat', backdrop_go: 'Décor des combats', mini: 'Mini-jeux et livre',
       mg_poker: 'Poker', mg_slots: 'Machines à sous', mg_slime_race: 'Course de gluants', mg_slime_touch: 'Jeu des gluants (tactile)', mg_curling: 'Curling de gluants', book: 'Livre des monstres',
       book: 'Livre', bk_all: 'Tout le livre à 100 %', bk_none: 'Vider le livre', bk_seen: 'dans le livre', bk_defeated: 'vaincus', bk_items: 'objet obtenu',
       bk_note: 'Cocher met le monstre dans le livre (vaincu une fois et son objet obtenu une fois s\'il n\'y était pas) ; décocher le retire.', bk_count: '%s / %s pages',
       party: 'Équipe', members: 'Membres', level: 'Niveau', exp: 'Expérience', set: 'Mettre', remove: 'Retirer', join: 'Ajouter à l\'équipe', values: 'Argent et temps de jeu',
       v_gold: 'Or', v_bank: 'Banque', v_coins: 'Jetons de casino', v_medals: 'Mini-médailles', v_play_time: 'Temps de jeu (h:mm:ss)', allitems: 'Objets', items_btn: 'Tous les objets × 99 dans le sac',
       items_note: 'Tous les objets du jeu, y compris ceux que le jeu réserve au débogage.',
       sw_global: 'globaux', sw_area: 'de la zone', sw_local: 'de la carte', sw_note: 'Cliquer un numéro l\'éteint.', fight_note: 'Un boss se lance chez lui (sa carte d\'abord), avec son décor, depuis n\'importe où. Les autres combats : seulement là où le jeu permet les combats aléatoires à ce moment (jamais en ville, ni quand l\'histoire les coupe).'},
  en: {state: 'State', packets: 'Packets', menus: 'Menus', objects: 'Objects', memory: 'Memory', states: 'Savestates',
       pause: 'Pause (F3)', resume: 'Resume (F3)', report: 'Bug report (F8)', follow: 'follow', read: 'Read', write: 'Write', log: 'Engine log',
       save: 'Save', load: 'Load', empty: 'empty', paused: 'PAUSED', replay: 'REPLAY', frame: 'frame', part: 'part', map: 'map', flags: 'flags',
       fade: 'front fade', bfade: 'back fade', menu: 'active menu', message: 'message', pace: 'pace', sprites: 'Characters', meshes: 'Meshes', camera: 'camera',
       port: 'port', type: 'type', cursor: 'cursor', buttons: 'buttons', lines: 'lines', yes: 'yes', no: 'no', confirm_write: 'Write into the engine\'s memory?', loadq: 'Load this savestate?',
       scenes: 'Scenes', maph: 'Map', go: 'Go', world: 'World map', world_here: 'in front of the current place', world_n: 'World', current: 'current map', step: 'Story step', apply: 'Apply', step_go: 'go to its map',
       step_note: 'Puts back the global switches and the party of that step; items, levels and gold do not change. The hero arrives through the map\'s main entrance.',
       fight: 'Fight', start_fight: 'Start the fight', row: 'row (empty: the place\'s)', bosses: 'bosses', switches: 'Switches', on: 'On', off: 'Off',
       items: 'Items and gold', give: 'Give', find: 'search…', gold_add: 'Gold (negative: take)', items_note: 'Given as a found item: to the first member with room, otherwise the bag.',
       group: 'group', fight_here: 'Fight this group here', backdrop_own: 'each fight\'s own backdrop', backdrop_go: 'Battle backdrop', mini: 'Mini-games and book',
       mg_poker: 'Poker', mg_slots: 'Slot machines', mg_slime_race: 'Slime race', mg_slime_touch: 'Slime touch', mg_curling: 'Slime curling', book: 'Monster book',
       book: 'Book', bk_all: 'Whole book at 100 %', bk_none: 'Empty the book', bk_seen: 'in the book', bk_defeated: 'defeated', bk_items: 'item obtained',
       bk_note: 'Ticking puts the monster in the book (defeated once and its item obtained once if it was not there); unticking takes it out.', bk_count: '%s / %s pages',
       party: 'Party', members: 'Members', level: 'Level', exp: 'Experience', set: 'Set', remove: 'Remove', join: 'Add to the party', values: 'Money and play time',
       v_gold: 'Gold', v_bank: 'Bank', v_coins: 'Casino tokens', v_medals: 'Mini medals', v_play_time: 'Play time (h:mm:ss)', allitems: 'Items', items_btn: 'Every item × 99 in the bag',
       items_note: 'Every item of the game, those the game keeps for debugging included.',
       sw_global: 'global', sw_area: 'area', sw_local: 'map', sw_note: 'Click a number to turn it off.', fight_note: 'A boss is fought at its own place (its map first), with its backdrop, from anywhere. Other fights: only where the game allows random encounters at that moment (never in a town, nor when the story switches them off).'}};
let L = T.en, lang = null, tab = 't_state', last = null, pkSince = -1, pkRows = [];
const $ = id => document.getElementById(id);
const TABS = ['state', 'scenes', 'party', 'book', 'packets', 'menus', 'objects', 'memory', 'states'];
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
async function get(path) { const r = await fetch(path); return r.json(); }
async function cmd(c) { const r = await fetch('/api/cmd', {method: 'POST', body: JSON.stringify(c)}); const j = await r.json(); if (j.error) $('msg').textContent = j.error; return j; }
function texts() {
  $('tabs').innerHTML = TABS.map(t => `<a data-t="t_${t}" class="${'t_' + t === tab ? 'sel' : ''}">${L[t]}</a>`).join('');
  for (const a of document.querySelectorAll('nav a')) a.onclick = () => { tab = a.dataset.t; texts(); show(); refresh(); };
  for (const [id, k] of [['h_map', 'maph'], ['sc_go', 'go'], ['sc_world', 'world'], ['h_step', 'step'], ['l_step_go', 'step_go'], ['sc_apply', 'apply'], ['sc_step_note', 'step_note'],
    ['sc_here', 'fight_here'], ['sc_backdrop_go', 'backdrop_go'], ['h_mini', 'mini'],
    ['bk_all', 'bk_all'], ['bk_none', 'bk_none'], ['bk_note', 'bk_note'],
    ['h_members', 'members'], ['pa_join', 'join'], ['h_values', 'values'], ['h_allitems', 'allitems'], ['pa_items', 'items_btn'], ['pa_items_note', 'items_note'],
    ['h_items', 'items'], ['sc_give', 'give'], ['sc_gold_go', 'gold_add'], ['sc_items_note', 'items_note'],
    ['h_fight', 'fight'], ['sc_fight', 'start_fight'], ['sc_fight_note', 'fight_note'], ['h_sw', 'switches'], ['sc_sw_note', 'sw_note'], ['sc_on', 'on'], ['sc_off', 'off']]) $(id).textContent = L[k];
  $('sc_set').innerHTML = ['global', 'area', 'local'].map(k => `<option value="${k}">${L['sw_' + k]}</option>`).join(''); $('sc_row').placeholder = L.row; $('sc_item_find').placeholder = L.find; $('bk_find').placeholder = L.find;
  $('b_report').textContent = L.report; $('l_follow').textContent = L.follow; $('mem_read').textContent = L.read; $('mem_write').textContent = L.write; $('h_log').textContent = L.log;
}
function show() { for (const s of document.querySelectorAll('section')) s.classList.toggle('sel', s.id === tab); }
function fade(f) { return f ? `${(+f.a).toFixed(2)} → ${(+f.end).toFixed(2)} (${f.n})` : '-'; }
function renderState(v) {
  if (v.language !== lang) { lang = v.language; L = T[lang] || T.en; catalog = null; texts(); show(); }          // (the catalog's lists again, in that language)
  $('title').textContent = v.game_name + ' — debug';
  $('status').textContent = `${L.frame} ${v.frame} · x${v.speed}` + (v.paused ? ' · ' + L.paused : '') + (v.replaying ? ' · ' + L.replay : '');
  $('b_pause').textContent = v.paused ? L.resume : L.pause; $('b_pause').classList.toggle('on', v.paused);
  const sp = $('speed'); if (sp.options.length !== v.speeds.length) sp.innerHTML = v.speeds.map(s => `<option value="${s}">x${s}</option>`).join('');
  if (document.activeElement !== sp) sp.value = v.speed;
  const rows = [[L.frame, `${v.frame} (loop ${v.loop})`], [L.part, `${v.part_name} (0x${v.part.toString(16)})`], [L.map, v.map || '-'], [L.flags, '0x' + v.flags.toString(16)],
    [L.fade, fade(v.fade)], [L.bfade, fade(v.background_fade)], [L.menu, v.menu || '-'], [L.message, v.message ? L.yes : L.no],
    [L.pace, `${v.steps_per_s.toFixed(1)} steps/s · step ${v.step_ms.toFixed(1)} ms · draw ${v.draw_ms.toFixed(1)} ms`]];
  $('state').innerHTML = rows.map(([k, x]) => `<span class="dim">${k}</span><span class="mono">${esc(x)}</span>`).join('');
  $('log').textContent = (v.log || []).join('\n');
}
function pkFilter() {
  const f = $('pk_filter').value.trim().split(/\s+/).filter(Boolean); const inc = f.filter(x => !x.startsWith('!')).map(Number), exc = f.filter(x => x.startsWith('!')).map(x => +x.slice(1));
  return t => (!inc.length || inc.includes(t)) && !exc.includes(t);
}
async function refreshPackets() {
  const rows = await get('/api/packets?since=' + pkSince); if (rows.length) { pkSince = rows[rows.length - 1][0]; pkRows = pkRows.concat(rows).slice(-240); }
  const ok = pkFilter(); const out = [];
  for (const [fr, pk] of pkRows) for (const [t, ints, fl, ni, nf] of pk) if (ok(t)) out.push(`${fr}  ${String(t).padStart(3)}  [${ints.join(', ')}${ni > ints.length ? ', …' + ni : ''}]` + (fl.length ? `  {${fl.join(', ')}${nf > fl.length ? ', …' + nf : ''}}` : ''));
  $('pk_count').textContent = out.length + ' / ' + pkRows.reduce((a, r) => a + r[1].length, 0);
  const pre = $('packets'); pre.textContent = out.slice(-600).join('\n'); if ($('pk_follow').checked) pre.scrollTop = pre.scrollHeight;
}
async function refreshMenus() {
  const ms = await get('/api/menus');
  $('menus').innerHTML = `<table><tr><th>${L.port}</th><th>${L.type}</th><th></th><th>${L.cursor}</th><th>grid</th><th>${L.buttons}</th><th>${L.lines}</th></tr>` + ms.map(m =>
    `<tr class="${m.active ? 'active' : ''}"><td>${m.port}${m.visible ? '' : ' <span class=dim>(hidden)</span>'}</td><td>${m.type}</td><td class="mono">${esc(m.name || '')}</td><td>${m.cursor ?? '-'}${m.local_cursor != null ? ' / ' + m.local_cursor : ''}</td><td>${esc(JSON.stringify(m.grid))}</td>` +
    `<td class="mono">${m.buttons.map(b => `${b[0]}:${b[1].toString(16)}@${b[2]},${b[3]}`).join(' ')}</td><td>${m.lines.map(esc).join('<br>')}</td></tr>`).join('') + '</table>';
}
async function refreshObjects() {
  const o = await get('/api/objects');
  $('objects').innerHTML = `<p>${L.map} ${esc(o.map || '-')} · ${L.camera} ${esc(JSON.stringify(o.camera))}</p><h4>${L.sprites}</h4><table><tr><th>slot</th><th>id</th><th>pos</th><th>visible</th><th>pose</th><th>dir</th><th>scale</th></tr>` +
    o.sprites.map(s => `<tr><td>${s.slot}</td><td>${s.id}</td><td class="mono">${esc(JSON.stringify(s.pos))}</td><td>${s.visible}</td><td>${s.pose}</td><td>${s.dir}</td><td>${s.scale}</td></tr>`).join('') + '</table>' +
    `<h4>${L.meshes}</h4><p class="mono">${o.meshes.map(m => `${m.slot}${m.visible ? '' : '(-)'}`).join(' ')}</p>`;
}
async function readMemory() {
  const m = await get('/api/memory?where=' + encodeURIComponent($('mem_where').value) + '&len=' + encodeURIComponent($('mem_len').value));
  if (m.error) { $('memory').textContent = m.error; return; }
  $('mem_info').textContent = '0x' + m.address.toString(16) + (m.lib_offset != null ? ' (lib +0x' + m.lib_offset.toString(16) + ')' : ''); $('memory').textContent = m.lines.join('\n');
}
async function refreshStates() {
  const ss = await get('/api/savestates');
  $('states').innerHTML = '<table>' + ss.map(s => `<tr><td>${s.slot}</td><td>${s.info ? esc(`${s.info.date} · ${s.info.map} · ${L.frame} ${s.info.frames}`) : '<span class=dim>' + L.empty + '</span>'}</td>` +
    `<td><button data-save="${s.slot}">${L.save}</button> ${s.info ? `<button data-load="${s.slot}">${L.load}</button>` : ''}</td></tr>`).join('') + '</table>';
  for (const b of document.querySelectorAll('[data-save]')) b.onclick = async () => { await cmd({cmd: 'save_state', slot: +b.dataset.save}); refreshStates(); };
  for (const b of document.querySelectorAll('[data-load]')) b.onclick = async () => { if (confirm(L.loadq)) await cmd({cmd: 'load_state', slot: +b.dataset.load}); };
}
let catalog = null;
async function loadCatalog() {
  catalog = await get('/api/catalog');
  const placeName = {}; for (const [n, name, map] of catalog.steps) if (map && name && !(map in placeName)) placeName[map] = name;          // a map's label: the first story step that goes there
  $('sc_map').innerHTML = catalog.maps.map(m => `<option value="${m}">${m}${placeName[m] ? ' — ' + esc(placeName[m]) : ''}</option>`).join('');
  if (catalog.map && catalog.maps.includes(catalog.map)) $('sc_map').value = catalog.map;
  $('sc_world_at').innerHTML = `<option value="">${esc(L.world_here)}</option>` + (catalog.worlds || []).map(([t, places]) =>          // each world map of the game, the places on it
    `<optgroup label="${esc(L.world_n)} ${t + 1}">` + places.map(([k, p, m]) => `<option value="${k}">${esc(p)} (${esc(m)})</option>`).join('') + '</optgroup>').join('');
  renderItems();
  $('sc_group').innerHTML = (catalog.encounters || []).map(([row, mons]) => `<option value="${row}">${row} — ${esc(mons.join(', '))}</option>`).join('');
  $('sc_backdrop').innerHTML = `<option value="">${L.backdrop_own}</option>` + (catalog.backdrops || []).map(n => `<option value="${n}">${n}</option>`).join('');
  $('sc_backdrop').value = catalog.backdrop || '';
  $('sc_minigames').innerHTML = (catalog.minigames || []).map(m => `<button data-mg="${m}">${L['mg_' + m] || m}</button>`).join('') + `<button id="sc_book">${L.book}</button>`;
  for (const b of document.querySelectorAll('[data-mg]')) b.onclick = () => cmd({cmd: 'minigame', id: b.dataset.mg});
  $('sc_book').onclick = () => cmd({cmd: 'book'});
  $('sc_step').innerHTML = catalog.steps.map(([n, name, map]) => `<option value="${n}">${n}${name ? ' — ' + esc(name) : ''}${map ? ' — ' + map : ''}</option>`).join('');
  $('sc_boss').innerHTML = `<option value="">${L.bosses}…</option>` + catalog.bosses.map(([row, mons, map]) => `<option value="${row}">${esc(mons.join(', '))} — ${row}${map ? ' — ' + map : ''}</option>`).join('');
  renderFlags(catalog);
}
function renderItems() {
  const f = $('sc_item_find').value.trim().toLowerCase(), keep = $('sc_item').value;
  $('sc_item').innerHTML = (catalog.items || []).filter(([n, name]) => !f || name.toLowerCase().includes(f) || String(n) === f).map(([n, name]) => `<option value="${n}">${esc(name)} — ${n}</option>`).join('');
  if (keep) $('sc_item').value = keep;
}
function renderFlags(c) {
  $('sc_cur').textContent = L.current + ' : ' + (c.map || '-');
  $('sc_flags').innerHTML = ['global', 'area', 'local'].map(k => `<p><span class="dim">${L['sw_' + k]} (${(c.flags[k] || []).length})</span> ` +
    (c.flags[k] || []).map(n => `<a data-set="${k}" data-n="${n}" style="cursor:pointer">${n}</a>`).join(' ') + '</p>').join('');
  for (const a of document.querySelectorAll('#sc_flags a')) a.onclick = () => cmd({cmd: 'flag', set: a.dataset.set, n: +a.dataset.n, on: false}).then(refreshScenes);
}
async function refreshScenes() { if (!catalog) return loadCatalog(); renderFlags(await get('/api/catalog?only=flags')); }
$('sc_go').onclick = () => cmd({cmd: 'goto_map', map: $('sc_map').value});
$('sc_world').onclick = () => cmd({cmd: 'goto_world', symbol: $('sc_world_at').value});
$('sc_here').onclick = () => cmd({cmd: 'battle_here', row: $('sc_group').value});
$('sc_backdrop_go').onclick = () => cmd({cmd: 'backdrop', name: $('sc_backdrop').value});
$('sc_item_find').oninput = renderItems;
$('sc_give').onclick = () => cmd({cmd: 'give_item', item: +$('sc_item').value, count: +$('sc_count').value || 1});
$('sc_gold_go').onclick = () => cmd({cmd: 'gold', amount: $('sc_gold').value.trim()});
$('sc_apply').onclick = () => cmd({cmd: 'story_step', step: +$('sc_step').value, go: $('sc_step_go').checked}).then(refreshScenes);
$('sc_boss').onchange = () => { $('sc_row').value = $('sc_boss').value; };
$('sc_fight').onclick = () => cmd({cmd: 'battle', row: $('sc_row').value.trim()});
$('sc_on').onclick = () => cmd({cmd: 'flag', set: $('sc_set').value, n: +$('sc_n').value, on: true}).then(refreshScenes);
$('sc_off').onclick = () => cmd({cmd: 'flag', set: $('sc_set').value, n: +$('sc_n').value, on: false}).then(refreshScenes);
let party = null, partyKey = '';
const STATS = {fr: {AdventureTime: 'Temps d\'aventure (chapitre)', BattleCount: 'Combats', VictoryCount: 'Victoires', WipeoutCount: 'Équipe anéantie', EscapeCount: 'Fuites',
  MonsterCount: 'Monstres vaincus', TotalGold: 'Or gagné', MaxDamage: 'Dégâts maximum', HeroLevel: 'Niveau du héros', Title: 'Titre', RestMonsterCount: 'Monstres restants',
  ChapterBattleCount: 'Combats du chapitre', ChapterWipeoutCount: 'Anéantissements du chapitre', ChapterEscapeCount: 'Fuites du chapitre'},
  en: {AdventureTime: 'Adventure time (chapter)', BattleCount: 'Battles', VictoryCount: 'Victories', WipeoutCount: 'Wipeouts', EscapeCount: 'Escapes', MonsterCount: 'Monsters defeated',
  TotalGold: 'Gold earned', MaxDamage: 'Highest damage', HeroLevel: 'Hero\'s level', Title: 'Title', RestMonsterCount: 'Monsters left', ChapterBattleCount: 'Battles this chapter',
  ChapterWipeoutCount: 'Wipeouts this chapter', ChapterEscapeCount: 'Escapes this chapter'}};
const valueLabel = k => k.startsWith('stat:') ? ((STATS[lang] || STATS.en)[k.slice(5)] || k.slice(5)) : (L['v_' + k] || k);
const hms = t => { const s = Math.floor(t / 60); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };          // (play time: 1/60 s)
const unhms = v => { const p = String(v).trim().split(':').map(Number); if (p.some(isNaN)) return NaN; let s = 0; for (const x of p) s = s * 60 + x; return Math.round(s * 60); };
async function refreshParty(force) {
  if (!force && document.activeElement && $('t_party').contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;          // (not while a field is being typed in)
  const p = await get('/api/party'); const key = JSON.stringify(p); if (!force && key === partyKey) return; partyKey = key; party = p;
  $('pa_members').innerHTML = `<table><tr><th></th><th>${L.level}</th><th></th><th>${L.exp}</th><th></th><th></th></tr>` + p.members.map(m =>
    `<tr><td>${esc(m.name)} <span class="dim">#${m.id}</span></td><td><input size="3" id="pl_${m.id}" value="${m.level}"></td><td><button data-lv="${m.id}">${L.set}</button></td>` +
    `<td><input size="9" id="px_${m.id}" value="${m.exp}"></td><td><button data-xp="${m.id}">${L.set}</button></td><td><button data-out="${m.id}">${L.remove}</button></td></tr>`).join('') + '</table>';
  const inside = new Set(p.members.map(m => m.id));
  $('pa_char').innerHTML = p.characters.filter(([n]) => !inside.has(n)).map(([n, name]) => `<option value="${n}">${esc(name)} — #${n}</option>`).join('');
  $('pa_values').innerHTML = Object.entries(p.values).map(([k, v]) => `<span class="dim">${esc(valueLabel(k))}</span><span class="row" style="margin:0"><input size="11" id="pv_${k}" value="${k === 'play_time' || k === 'stat:AdventureTime' ? hms(v) : v}"><button data-val="${k}">${L.set}</button></span>`).join('');
  const act = (sel, fn) => { for (const b of document.querySelectorAll(sel)) b.onclick = () => fn(b).then(() => refreshParty(true)); };
  act('[data-lv]', b => cmd({cmd: 'party_level', id: +b.dataset.lv, level: +$('pl_' + b.dataset.lv).value}));
  act('[data-xp]', b => cmd({cmd: 'party_exp', id: +b.dataset.xp, exp: +$('px_' + b.dataset.xp).value}));
  act('[data-out]', b => cmd({cmd: 'party_quit', id: +b.dataset.out}));
  act('[data-val]', b => { const k = b.dataset.val, v = $('pv_' + k).value; return cmd({cmd: 'value', key: k, value: k === 'play_time' || k === 'stat:AdventureTime' ? unhms(v) : +v}); });
}
$('pa_join').onclick = () => cmd({cmd: 'party_join', id: +$('pa_char').value}).then(() => setTimeout(() => refreshParty(true), 300));
$('pa_items').onclick = () => cmd({cmd: 'items_max'});
let bookKey = '';
async function refreshBook(force) {
  const b = await get('/api/book'); if (b.error) { $('msg').textContent = b.error; return; }
  const key = JSON.stringify(b) + $('bk_find').value; if (!force && key === bookKey) return; bookKey = key;
  $('bk_count').textContent = L.bk_count.replace('%s', b.seen).replace('%s', b.size);
  const f = $('bk_find').value.trim().toLowerCase();
  $('bk_pages').innerHTML = `<table><tr><th>#</th><th></th><th>${L.bk_seen}</th><th>${L.bk_defeated}</th><th>${L.bk_items}</th></tr>` + b.pages.filter(([p, m, name]) => !f || name.toLowerCase().includes(f) || String(p + 1) === f).map(([p, m, name, seen, d, it]) =>
    `<tr><td class="dim">${p + 1}</td><td>${esc(name)} <span class="dim">#${m}</span></td><td><input type="checkbox" data-bk="${p}"${seen ? ' checked' : ''}></td><td>${d}</td><td>${it}</td></tr>`).join('') + '</table>';
  for (const c of document.querySelectorAll('[data-bk]')) c.onchange = () => cmd({cmd: 'book_seen', page: +c.dataset.bk, on: c.checked}).then(() => refreshBook(true));
}
$('bk_all').onclick = () => cmd({cmd: 'book_all', on: true}).then(() => refreshBook(true));
$('bk_none').onclick = () => { if (confirm(L.bk_none + ' ?')) cmd({cmd: 'book_all', on: false}).then(() => refreshBook(true)); };
$('bk_find').oninput = () => refreshBook(true);
const PAGES = {t_book: refreshBook, t_party: refreshParty, t_scenes: refreshScenes, t_packets: refreshPackets, t_menus: refreshMenus, t_objects: refreshObjects, t_states: refreshStates};
async function refresh() {
  try { const v = await get('/api/state'); if (v.error) throw new Error(v.error); last = v; renderState(v); $('msg').textContent = ''; } catch (e) { $('msg').textContent = String(e); }
  if (PAGES[tab] && (tab !== 't_states' || !refresh.statesShown)) { try { await PAGES[tab](); } catch (e) { $('msg').textContent = String(e); } }
  refresh.statesShown = tab === 't_states';
}
$('b_pause').onclick = () => cmd({cmd: last && last.paused ? 'resume' : 'pause'}).then(refresh);
$('b_step1').onclick = () => cmd({cmd: 'step', n: 1}).then(refresh);
$('b_step10').onclick = () => cmd({cmd: 'step', n: 10}).then(refresh);
$('b_step60').onclick = () => cmd({cmd: 'step', n: 60}).then(refresh);
$('speed').onchange = () => cmd({cmd: 'speed', value: +$('speed').value});
$('b_report').onclick = () => cmd({cmd: 'report'});
$('mem_read').onclick = readMemory;
$('mem_write').onclick = () => { if (confirm(L.confirm_write)) cmd({cmd: 'write_memory', where: $('mem_where').value, bytes: $('mem_bytes').value}).then(readMemory); };
texts(); show(); refresh(); setInterval(refresh, 500);
</script>
</body>
